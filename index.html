<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printou Sales Hub - Controle de Vendas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        window.addEventListener('error', function(event) {
            alert('ERRO JS: ' + event.message + ' em ' + event.filename + ':' + event.lineno);
        });
        window.addEventListener('unhandledrejection', function(event) {
            alert('ERRO PROMISE: ' + (event.reason ? event.reason.message || event.reason : 'desconhecido'));
        });

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#7C3AED',
                            yellow: '#14B8A6',
                            darkBg: '#14141b',
                            cardBg: 'rgba(18, 18, 22, 0.7)',
                            borderBg: 'rgba(255, 255, 255, 0.08)',
                            glow: 'rgba(124, 58, 237, 0.15)',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #14141b;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism custom styling */
        .glass-panel {
            background: rgba(18, 18, 22, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
            transform: translateY(-2px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #14141b;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7C3AED;
        }

        /* Text gradient */
        .text-gradient {
            background: linear-gradient(135deg, #7C3AED 0%, #14B8A6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #7C3AED 0%, #0D9488 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.45);
            transform: scale(1.02);
        }
        /* Estilos de Tema Claro (Light Mode) */
        html.light {
            background-color: #F3F4F6 !important;
        }

        html.light body {
            background-color: #F3F4F6 !important;
            color: #1F2937 !important;
        }

        /* Painel e Card em Vidro Claro */
        html.light .glass-panel {
            background: rgba(255, 255, 255, 0.8) !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
        }

        html.light .glass-card {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(0, 0, 0, 0.06) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02) !important;
        }

        html.light .glass-card:hover {
            border-color: rgba(124, 58, 237, 0.4) !important;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.08) !important;
        }

        /* Sidebar no tema claro */
        html.light aside {
            background: #FFFFFF !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.02) !important;
        }

        /* Inputs e selects no tema claro */
        html.light input, 
        html.light select, 
        html.light textarea {
            background-color: #FFFFFF !important;
            color: #1F2937 !important;
            border-color: rgba(0, 0, 0, 0.15) !important;
        }

        html.light input::placeholder {
            color: #9CA3AF !important;
        }

        html.light input:focus, 
        html.light select:focus {
            border-color: #7C3AED !important;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1) !important;
        }

        /* Textos e Cores no tema claro */
        html.light .text-white {
            color: #111827 !important;
        }

        html.light .text-gray-400 {
            color: #4B5563 !important;
        }

        html.light .text-gray-300 {
            color: #374151 !important;
        }

        html.light .text-gray-500 {
            color: #6B7280 !important;
        }

        /* Sub-backgrounds e tabelas */
        html.light .bg-\[\#121215\], 
        html.light .bg-\[\#16161A\],
        html.light .bg-\[\#111115\] {
            background-color: #F9FAFB !important;
        }

        html.light .bg-white\/5 {
            background-color: rgba(0, 0, 0, 0.03) !important;
        }

        html.light .hover\:bg-white\/5:hover {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        html.light .divide-white\/5 > * + * {
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        html.light .border-white\/5 {
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        html.light .border-white\/15 {
            border-color: rgba(0, 0, 0, 0.12) !important;
        }

        html.light .border-brand-borderBg {
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        /* Botões */
        html.light .bg-white\/5.text-white {
            background-color: #FFFFFF !important;
            color: #374151 !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        html.light .bg-white\/5.text-white:hover {
            background-color: rgba(0, 0, 0, 0.02) !important;
        }

        html.light .text-gray-400.hover\:text-white:hover {
            color: #000000 !important;
        }

        /* Títulos de tabelas */
        html.light .bg-white\/5.border-b {
            background-color: rgba(0, 0, 0, 0.02) !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        html.light ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }
    </style>
    <!-- Chart.js CDN para Gráficos Interativos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Interceptador global de erros para depurar tela branca
        window.addEventListener('error', function(event) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.top = '0';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.backgroundColor = '#F43F5E';
            errDiv.style.color = '#FFFFFF';
            errDiv.style.padding = '20px';
            errDiv.style.zIndex = '99999';
            errDiv.style.fontFamily = 'monospace';
            errDiv.style.whiteSpace = 'pre-wrap';
            errDiv.innerHTML = '<h3>🚨 Erro Crítico de Código:</h3>' + event.message + '<br/><br/><strong>Local:</strong> ' + event.filename + ':' + event.lineno + ':' + event.colno + '<br/><br/><strong>Erro:</strong> ' + (event.error ? event.error.stack : 'N/A');
            document.body.appendChild(errDiv);
        });

        // Utilitário para limpar cache local via URL (?clear)
        if (window.location.search.includes('clear')) {
            localStorage.clear();
            window.location.href = window.location.pathname;
        }

        const { useState, useEffect, useMemo, useRef } = React;

        // --- DADOS INICIAIS DO LOCALSTORAGE (MOCK) ---
        const INITIAL_CHANNELS = [
            { id: 'ml1', name: 'printoustudio3d', commission: 12.0, fixedFee: 6.0, color: '#FFE600', hasFreeShippingThreshold: true, freeShippingThreshold: 79.0, defaultSellerShippingCost: 19.90, defaultBelowThresholdShippingCost: 0.0 },
            { id: 'ml2', name: 'CPS Solu��es', commission: 19.5, fixedFee: 6.0, color: '#14B8A6', hasFreeShippingThreshold: true, freeShippingThreshold: 79.0, defaultSellerShippingCost: 19.90, defaultBelowThresholdShippingCost: 0.0 },
            { id: 'shopee', name: 'Shopee', commission: 14.0, fixedFee: 3.0, color: '#EE4D2D', hasFreeShippingThreshold: false, freeShippingThreshold: 0, defaultSellerShippingCost: 0.0, defaultBelowThresholdShippingCost: 0.0 },
            { id: 'site', name: 'Site Próprio', commission: 3.99, fixedFee: 0.5, color: '#0088FF', hasFreeShippingThreshold: false, freeShippingThreshold: 0, defaultSellerShippingCost: 0.0, defaultBelowThresholdShippingCost: 0.0 },
            { id: 'direta', name: 'Venda Direta / Pix', commission: 0.0, fixedFee: 0.0, color: '#30D158', hasFreeShippingThreshold: false, freeShippingThreshold: 0, defaultSellerShippingCost: 0.0, defaultBelowThresholdShippingCost: 0.0 }
        ];

        const INITIAL_PRODUCTS = [];

        const INITIAL_SUPPLIERS = [];

        const INITIAL_FILAMENTS = [];

        const INITIAL_SALES = [];

        const INITIAL_EXPENSES = [];

        // Utilitário para mutação atômica
        const mutateServer = async (collection, action, payload, id) => {
            try {
                await fetch('/api/mutate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ collection, action, payload, id })
                });
            } catch (e) {
                console.error("Erro na mutação:", e);
            }
        };

        function App() {
            // --- ESTADOS DO SISTEMA ---
            const [currentUser, setCurrentUser] = useState(() => {
                const local = localStorage.getItem('printou_user');
                return local ? JSON.parse(local) : null;
            });
            const [activeTab, setActiveTab] = useState('dashboard');
            const [editingProductGlobal, setEditingProductGlobal] = useState(null);
            const [isAddingProductGlobal, setIsAddingProductGlobal] = useState(false);
            const [stockEntry, setStockEntry] = useState(null);
            const [stockExit, setStockExit] = useState(null);
            const [stockMovements, setStockMovements] = useState(() => {
                const local = localStorage.getItem('printou_stock_movements');
                return local ? JSON.parse(local) : [];
            });
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('printou_theme') || 'light';
            });

            useEffect(() => {
                localStorage.setItem('printou_theme', theme);
                if (theme === 'light') {
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                }
            }, [theme]);

            const [channels, setChannels] = useState(() => {
                const local = localStorage.getItem('printou_channels');
                return local ? JSON.parse(local) : INITIAL_CHANNELS;
            });
            const [products, setProducts] = useState(() => {
                const local = localStorage.getItem('printou_products');
                return local ? JSON.parse(local) : INITIAL_PRODUCTS;
            });
            const [suppliers, setSuppliers] = useState(() => {
                const local = localStorage.getItem('printou_suppliers');
                return local ? JSON.parse(local) : INITIAL_SUPPLIERS;
            });
            const [expenses, setExpenses] = useState(() => {
                const local = localStorage.getItem('printou_expenses');
                return local ? JSON.parse(local) : INITIAL_EXPENSES;
            });
            const [sales, setSales] = useState(() => {
                const local = localStorage.getItem('printou_sales');
                return local ? JSON.parse(local) : INITIAL_SALES;
            });
            const [filaments, setFilaments] = useState(() => {
                const local = localStorage.getItem('printou_filaments');
                return local ? JSON.parse(local) : INITIAL_FILAMENTS;
            });

            const findProduct = (productId) => {
                if (!productId) return null;
                return products.find(p => p.id === productId || (p.externalIds && p.externalIds.includes(productId)));
            };

            const [integrationLogs, setIntegrationLogs] = useState([]);
            const [credentials, setCredentials] = useState({
                mercadolivre: { clientId: '', clientSecret: '', webhookUrl: 'http://localhost:3001/api/webhooks/mercadolivre', status: 'Sincronizado' },
                shopee: { shopId: '', apiKey: '', webhookUrl: 'http://localhost:3001/api/webhooks/shopee', status: 'Sincronizado' }
            });
            const [isLoaded, setIsLoaded] = useState(false);
            const hasLoadedFromServer = useRef(false);

            // Estados da Assistente Kika
            const [isKikaOpen, setIsKikaOpen] = useState(false);
            const [kikaSearch, setKikaSearch] = useState('');
            const [selectedGuide, setSelectedGuide] = useState(null);
            const [monthlyClosings, setMonthlyClosings] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [transactions, setTransactions] = useState([]);

            const refreshDatabaseData = async () => {
                try {
                    const response = await fetch('/api/data');
                    if (response.ok) {
                        const serverData = await response.json();
                        
                        // Obter dados locais atuais do LocalStorage
                        const localSalesRaw = localStorage.getItem('printou_sales');
                        const localProductsRaw = localStorage.getItem('printou_products');
                        const localChannelsRaw = localStorage.getItem('printou_channels');
                        const localSuppliersRaw = localStorage.getItem('printou_suppliers');
                        const localExpensesRaw = localStorage.getItem('printou_expenses');
                        const localFilamentsRaw = localStorage.getItem('printou_filaments');
                        
                        const localSales = localSalesRaw ? JSON.parse(localSalesRaw) : [];
                        const localProducts = localProductsRaw ? JSON.parse(localProductsRaw) : [];
                        const localChannels = localChannelsRaw ? JSON.parse(localChannelsRaw) : [];
                        const localSuppliers = localSuppliersRaw ? JSON.parse(localSuppliersRaw) : [];
                        const localExpenses = localExpensesRaw ? JSON.parse(localExpensesRaw) : [];
                        const localFilaments = localFilamentsRaw ? JSON.parse(localFilamentsRaw) : [];
                        
                        // Detecta se o servidor (Render) sofreu um reset (disco efêmero)
                        // Considera reset se o servidor não tem produtos, mas o local tem.
                        const isServerReset = (!serverData.products || serverData.products.length === 0) && localProducts.length > 0;
                        
                        let finalSales, finalProducts, finalChannels, finalSuppliers, finalExpenses, finalFilaments;

                        if (isServerReset) {
                            console.log("[Auto-Healing] Servidor parece ter resetado. Restaurando dados do LocalStorage...");
                            finalSales = localSales;
                            finalProducts = localProducts;
                            finalChannels = localChannels;
                            finalSuppliers = localSuppliers;
                            finalExpenses = localExpenses;
                            finalFilaments = localFilaments;
                            
                            // Dispara restauração para o servidor
                            const updatedPayload = {
                                ...serverData,
                                sales: finalSales,
                                products: finalProducts,
                                filaments: finalFilaments,
                                expenses: finalExpenses,
                                suppliers: finalSuppliers,
                                channels: finalChannels
                            };
                            fetch('/api/data', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updatedPayload)
                            }).catch(console.error);
                        } else {
                            // Se o servidor tem dados, o SERVIDOR É A FONTE DA VERDADE. Não mesclar com local stale!
                            finalSales = serverData.sales || [];
                            finalProducts = serverData.products || [];
                            finalChannels = serverData.channels || [];
                            finalSuppliers = serverData.suppliers || [];
                            finalExpenses = serverData.expenses || [];
                            finalFilaments = serverData.filaments || [];
                        }
                        
                        setSales(finalSales);
                        setProducts(finalProducts);
                        setChannels(finalChannels);
                        setSuppliers(finalSuppliers);
                        setExpenses(finalExpenses);
                        setFilaments(finalFilaments);
                        
                        if (serverData.monthlyClosings) setMonthlyClosings(serverData.monthlyClosings);
                        if (serverData.accounts) setAccounts(serverData.accounts);
                        if (serverData.transactions) setTransactions(serverData.transactions);
                        if (serverData.integrationLogs) setIntegrationLogs(serverData.integrationLogs);
                        if (serverData.credentials) setCredentials(serverData.credentials);

                        hasLoadedFromServer.current = true;
                    }
                } catch (error) {
                    console.warn("Servidor de banco de dados offline. Usando fallback LocalStorage:", error);
                } finally {
                    setIsLoaded(true);
                }
            };

            // Tenta carregar dados do banco de dados local na inicialização e inicia auto-refresh
            useEffect(() => {
                refreshDatabaseData();
                
                // Auto-refresh a cada 60 segundos
                const interval = setInterval(() => {
                    refreshDatabaseData();
                }, 60000);
                
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (currentUser) {
                    try {
                        localStorage.setItem('printou_user', JSON.stringify(currentUser));
                    } catch (e) {
                        console.warn("Falha ao salvar usuário no LocalStorage", e);
                    }
                } else {
                    localStorage.removeItem('printou_user');
                }
            }, [currentUser]);

            const handleLogout = () => {
                setCurrentUser(null);
            };

            useEffect(() => {
                setIsSidebarOpen(false);
            }, [activeTab]);

            const currentYearMonth = new Date().toISOString().substring(0, 7);
            const [selectedMonth, setSelectedMonth] = useState(currentYearMonth);

            const availableMonths = useMemo(() => {
                const months = new Set();
                months.add(currentYearMonth);
                months.add('2026-07');
                sales.forEach(s => { if (s.date) months.add(s.date.substring(0, 7)); });
                expenses.forEach(e => { if (e.competency) months.add(e.competency); });
                return Array.from(months).sort().reverse();
            }, [sales, expenses]);

            // State do Modal de Nova Venda
            const [isSaleModalOpen, setIsSaleModalOpen] = useState(false);
            const [newSale, setNewSale] = useState({
                channelId: 'direta',
                productId: 'p1',
                quantity: 1,
                grossValue: '',
                shipping: '0.00',
                status: 'Pago'
            });

            // Migração de nomes antigos do Mercado Livre salvos no LocalStorage e ajuste de taxas/fretes
            useEffect(() => {
                let updated = false;
                const newChans = channels.map(c => {
                    let changed = false;
                    let target = { ...c };
                    if (c.id === 'ml1' && (c.name === 'Mercado Livre - Conta 1' || c.commission === 16.5)) {
                        target.name = 'printoustudio3d';
                        target.commission = 12.0;
                        changed = true;
                    }
                    if (c.id === 'ml2' && (c.name === 'Mercado Livre - Conta 2' || c.commission === 12.0)) {
                        target.name = 'CPS Solu��es';
                        target.commission = 19.5;
                        target.color = '#14B8A6';
                        changed = true;
                    }
                    // Garantir novas propriedades de frete
                    if (target.hasFreeShippingThreshold === undefined) {
                        const initialRef = INITIAL_CHANNELS.find(ic => ic.id === target.id);
                        if (initialRef) {
                            target.hasFreeShippingThreshold = initialRef.hasFreeShippingThreshold;
                            target.freeShippingThreshold = initialRef.freeShippingThreshold;
                            target.defaultSellerShippingCost = initialRef.defaultSellerShippingCost;
                            target.defaultBelowThresholdShippingCost = initialRef.defaultBelowThresholdShippingCost;
                            changed = true;
                        }
                    }
                    if (changed) updated = true;
                    return target;
                });
                if (updated) {
                    setChannels(newChans);
                }
            }, []);

            // Lógica de cálculo de frete sugerido automático no lançamento de vendas
            useEffect(() => {
                const chan = channels.find(c => c.id === newSale.channelId);
                const prod = findProduct(newSale.productId);
                
                if (chan) {
                    const gross = parseFloat(newSale.grossValue) || 0;
                    // Tenta usar o custo de frete específico do produto se configurado, senão usa o padrão do canal
                    const productShipping = (prod && prod.customShippingCost !== undefined && prod.customShippingCost > 0) 
                        ? prod.customShippingCost 
                        : (chan.defaultSellerShippingCost || 0);

                    let suggestedShipping = 0;
                    if (chan.hasFreeShippingThreshold) {
                        if (gross >= chan.freeShippingThreshold) {
                            suggestedShipping = productShipping;
                        } else {
                            suggestedShipping = chan.defaultBelowThresholdShippingCost || 0;
                        }
                    } else {
                        suggestedShipping = productShipping || 0;
                    }
                    
                    if (parseFloat(newSale.shipping) !== suggestedShipping && newSale.shipping !== suggestedShipping.toFixed(2)) {
                        setNewSale(prev => ({ ...prev, shipping: suggestedShipping.toFixed(2) }));
                    }
                }
            }, [newSale.channelId, newSale.grossValue, newSale.productId, channels, products]);

            // Auto-preenche o preço bruto da venda com o preço de venda cadastrado no produto
            useEffect(() => {
                const prod = findProduct(newSale.productId);
                if (prod) {
                    const fallbackPrice = (calculateProductCost(prod) * (prod.type === 'resale' ? 1.8 : 3));
                    const finalPrice = prod.price > 0 ? prod.price : fallbackPrice;
                    setNewSale(prev => ({ ...prev, grossValue: finalPrice.toFixed(2) }));
                }
            }, [newSale.productId, products]);

            // Sincronização geral com LocalStorage e Banco de Dados Local (com debounce de 100ms)
            useEffect(() => {
                if (!isLoaded || !hasLoadedFromServer.current) return;

                try {
                    localStorage.setItem('printou_channels', JSON.stringify(channels));
                    localStorage.setItem('printou_products', JSON.stringify(products));
                    localStorage.setItem('printou_sales', JSON.stringify(sales));
                    localStorage.setItem('printou_suppliers', JSON.stringify(suppliers));
                    localStorage.setItem('printou_expenses', JSON.stringify(expenses));
                    localStorage.setItem('printou_filaments', JSON.stringify(filaments));
                } catch (e) {
                    console.warn("Aviso: Limite de armazenamento LocalStorage excedido. Limpando cache de produtos local para liberar espaço...", e);
                    try {
                        localStorage.removeItem('printou_products');
                    } catch (err) {}
                }

                const sync = async () => {
                    try {
                        await fetch('/api/data', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                sales,
                                products,
                                channels,
                                suppliers,
                                expenses,
                                filaments
                            })
                        });
                    } catch (err) {
                        // Silencioso: continua usando LocalStorage normalmente se offline
                    }
                };
                const timer = setTimeout(sync, 100);

            return () => clearTimeout(timer);
            }, [channels, products, sales, suppliers, expenses, filaments]);

            // Re-inicializar ícones Lucide
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, isSaleModalOpen, sales, products, expenses, theme]);

            // --- CÁLCULO DE CUSTO DO PRODUTO (Com Taxa de Perda/Falha ou Custo de Revenda) ---
            const calculateProductCost = (prod) => {
                if (prod.type === 'resale') {
                    return parseFloat((prod.acquisitionCost || 0).toFixed(2));
                }
                const filCost = (prod.weight * prod.filamentCost) / 1000;
                const machCost = prod.printTime * prod.machineHourCost;
                const rateFactor = 1 + ((prod.failRate || 0) / 100);
                const rawCost = (filCost + machCost) * rateFactor;
                return parseFloat((rawCost + prod.finishingCost + prod.packagingCost).toFixed(2));
            };

            // --- LÓGICA DE CÁLCULO FINANCEIRO POR VENDA ---
            const computeSaleFinancials = (sale) => {
                const prod = findProduct(sale.productId);
                const chan = channels.find(c => c.id === sale.channelId);
                
                const productCostTotal = prod ? calculateProductCost(prod) * sale.quantity : 0;
                
                let fee = 0;
                if (chan) {
                    let fixedFee = chan.fixedFee;
                    // Regra Mercado Livre: Sem taxa fixa para vendas >= R$ 79
                    if ((chan.id.startsWith('ml') || chan.name.toLowerCase().includes('mercado')) && sale.grossValue >= 79) {
                        fixedFee = 0;
                    }
                    fee = (sale.grossValue * (chan.commission / 100)) + fixedFee;
                }
                
                // Prioridade 1: Frete customizado configurado no produto (aba Produtos)
                let shipping = (prod && prod.customShippingCost !== undefined && prod.customShippingCost > 0)
                    ? parseFloat(prod.customShippingCost)
                    : 0;

                // Prioridade 2: Se não houver frete no produto, usa o frete vindo do canal/integração
                if (shipping === 0) {
                    shipping = parseFloat(sale.shipping) || 0;
                }

                // Prioridade 3: Fallback para regras gerais do canal
                if (shipping === 0 && chan) {
                    const defaultCost = chan.defaultSellerShippingCost || 0;
                    if (chan.hasFreeShippingThreshold) {
                        if (sale.grossValue >= chan.freeShippingThreshold) {
                            shipping = defaultCost;
                        } else {
                            shipping = chan.defaultBelowThresholdShippingCost || 0;
                        }
                    } else {
                        shipping = defaultCost;
                    }
                }
                
                const netProfit = sale.status === 'Cancelado' ? 0 : parseFloat((sale.grossValue - fee - productCostTotal - shipping).toFixed(2));
                
                return {
                    productCost: productCostTotal,
                    fees: fee,
                    netProfit: netProfit,
                    shippingApplied: shipping
                };
            };

            // --- METRICAS GERAIS PARA O DASHBOARD ---
            const financeStats = useMemo(() => {
                let totalGross = 0;
                let totalNet = 0;
                let totalFees = 0;
                let totalShipping = 0;
                let activeSalesCount = 0;

                const filteredSales = sales.filter(s => s.date.startsWith(selectedMonth));

                filteredSales.forEach(sale => {
                    if (sale.status !== 'Cancelado') {
                        const fin = computeSaleFinancials(sale);
                        totalGross += sale.grossValue;
                        totalNet += fin.netProfit;
                        totalFees += fin.fees;
                        totalShipping += fin.shippingApplied;
                        activeSalesCount++;
                    }
                });

                const filteredExpenses = expenses.filter(e => e.competency === selectedMonth && e.category !== 'Matéria-Prima');
                const totalAdmExpenses = filteredExpenses.reduce((acc, curr) => acc + curr.value, 0);
                const companyRealNet = totalNet - totalAdmExpenses;
                const averageMargin = totalGross > 0 ? (totalNet / totalGross) * 100 : 0;

                let totalStockQuantity = 0;
                const totalStockInvestment = products.reduce((acc, prod) => {
                    const cost = calculateProductCost(prod) || 0;
                    const stockQty = prod.stock || 0;
                    totalStockQuantity += stockQty;
                    return acc + (cost * stockQty);
                }, 0);

                const profitRate = totalGross > 0 ? totalNet / totalGross : 0;
                const breakevenSalesValue = profitRate > 0 ? totalAdmExpenses / profitRate : 0;
                const breakevenProgress = breakevenSalesValue > 0 ? Math.min((totalGross / breakevenSalesValue) * 100, 100) : (totalGross > 0 && totalAdmExpenses === 0 ? 100 : 0);

                return {
                    gross: totalGross,
                    net: totalNet,
                    fees: totalFees,
                    shipping: totalShipping,
                    count: activeSalesCount,
                    margin: averageMargin,
                    admExpenses: totalAdmExpenses,
                    companyRealNet: companyRealNet,
                    breakevenTarget: breakevenSalesValue,
                    breakevenProgress: breakevenProgress,
                    stockInvestment: totalStockInvestment,
                    stockQuantity: totalStockQuantity
                };
            }, [sales, products, channels, expenses, selectedMonth]);

            const registerSaleAndDeductStock = (saleToAdd) => {
                const saleMonth = (saleToAdd.date || new Date().toISOString()).substring(0, 7);
                if (monthlyClosings.some(c => c.month === saleMonth)) {
                    alert(`Não é permitido realizar lançamentos para o mês fechado ${saleMonth}.`);
                    return;
                }
                setSales(prevSales => [saleToAdd, ...prevSales]);
                
                if (saleToAdd.status !== 'Cancelado') {
                    // 1. Deduz estoque de unidades físicas do produto no catálogo
                    setProducts(prevProds => prevProds.map(p => {
                        if (p.id === saleToAdd.productId || (p.externalIds && p.externalIds.includes(saleToAdd.productId))) {
                            return { ...p, stock: Math.max(0, (p.stock || 0) - saleToAdd.quantity) };
                        }
                        return p;
                    }));

                    // 2. Deduz filamento se aplicável
                    const prod = findProduct(saleToAdd.productId);
                    if (prod && prod.type === '3d' && prod.filamentId) {
                        setFilaments(prevFilaments => prevFilaments.map(fil => {
                            if (fil.id === prod.filamentId) {
                                return { 
                                    ...fil, 
                                    currentWeight: Math.max(0, parseFloat((fil.currentWeight - (prod.weight * saleToAdd.quantity)).toFixed(1)))
                                };
                            }
                            return fil;
                        }));
                    }
                }
                
                // Salvar a venda no banco de dados (o back-end não subtrai estoque de vendas manuais recebidas por /api/mutate ainda, mas a venda fica registrada)
                mutateServer('sales', 'add', saleToAdd);
            };

            // --- ADICIONAR NOVA VENDA ---
            const handleAddSale = (e) => {
                e.preventDefault();
                const saleToAdd = {
                    id: 's' + (sales.length + 1) + Date.now().toString().slice(-3),
                    date: new Date().toISOString(),
                    channelId: newSale.channelId,
                    productId: newSale.productId,
                    quantity: parseInt(newSale.quantity),
                    grossValue: parseFloat(newSale.grossValue),
                    shipping: parseFloat(newSale.shipping) || 0,
                    status: newSale.status
                };

                registerSaleAndDeductStock(saleToAdd);
                setIsSaleModalOpen(false);
                // Reset form
                setNewSale({
                    channelId: 'direta',
                    productId: products[0]?.id || '',

                    status: 'Pago'
                });
            };

            const handleIncomingMarketplaceSale = (saleData) => {

                    const newProd = {

                        failRate: 10,

                        image: saleData.productImage,

                        filamentId: guessedType === '3d' ? 'fil1' : undefined // Link padrão para filamento preto
                    };
                    setProducts(prev => [...prev, newProd]);
                }

                // 2. Registra a venda e deduz estoque
                const saleToAdd = {
                    id: 's_auto_' + Date.now().toString().slice(-4),
                    date: new Date().toISOString().split('T')[0],

            };

            if (!currentUser) {

                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Frete Vendedor &lt; Limite (R$)</label>
                                            <input 
                                                type="number" step="0.01" required
                                                value={editedDefaultBelowCost}
                                                onChange={e => setEditedDefaultBelowCost(e.target.value)}
                                                className="w-full bg-brand-darkBg border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                            />
                                        </div>
                                    </div>
                                )}
                            </div>

                            <button 
                                type="submit"
                                className="w-full btn-gradient py-3.5 rounded-xl font-bold text-black uppercase tracking-wide transition-all"
                            >
                                Salvar Configurações do Canal
                            </button>
                        </form>
                    </div>

                    {/* Painel de Backup e Segurança */}
                    <div className="glass-panel rounded-2xl p-6 border border-white/10 mt-6 space-y-4">
                        <div className="flex items-center gap-3">
                            <svg className="text-brand-orange w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                            <h4 className="font-extrabold text-white text-lg">Segurança & Backup dos Dados</h4>
                        </div>
                        <p className="text-xs text-gray-400 leading-relaxed">
                            Para evitar qualquer perda de informações (vendas, catálogo, custos), você pode fazer backups periódicos. Caso ocorra qualquer reset no servidor, o sistema se auto-recupera usando o seu navegador. Além disso, você pode exportar manualmente os dados a qualquer momento.
                        </p>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <button
                                type="button"
                                onClick={() => {
                                    const backupData = {
                                        sales: JSON.parse(localStorage.getItem('printou_sales') || '[]'),
                                        products: JSON.parse(localStorage.getItem('printou_products') || '[]'),
                                        channels: JSON.parse(localStorage.getItem('printou_channels') || '[]'),
                                        suppliers: JSON.parse(localStorage.getItem('printou_suppliers') || '[]'),
                                        expenses: JSON.parse(localStorage.getItem('printou_expenses') || '[]'),
                                        filaments: JSON.parse(localStorage.getItem('printou_filaments') || '[]')
                                    };
                                    
                                    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = `backup_printou_sales_hub_${new Date().toISOString().split('T')[0]}.json`;
                                    document.body.appendChild(a);
                                    a.click();
                                    document.body.removeChild(a);
                                    URL.revokeObjectURL(url);
                                }}
                                className="bg-[#121215] border border-emerald-500/20 hover:bg-emerald-500/10 text-emerald-400 font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer"
                            >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Exportar Backup (Baixar)
                            </button>
                            
                            <label
                                className="bg-[#121215] border border-brand-orange/20 hover:bg-brand-orange/10 text-brand-orange font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer text-center"
                            >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                </svg>
                                Importar Backup (Restaurar)
                                <input
                                    type="file"
                                    accept=".json"
                                    onChange={(e) => {
                                        const file = e.target.files[0];
                                        if (!file) return;
                                        const reader = new FileReader();
                                        reader.onload = async (event) => {
                                            try {
                                                const imported = JSON.parse(event.target.result);
                                                if (imported.sales && imported.products) {
                                                    if (confirm("ATENÇÃO: Importar este arquivo substituirá os dados atuais do sistema. Tem certeza que deseja prosseguir?")) {
                                                        try {
                                                            if (imported.sales) localStorage.setItem('printou_sales', JSON.stringify(imported.sales));
                                                            if (imported.products) localStorage.setItem('printou_products', JSON.stringify(imported.products));
                                                            if (imported.channels) localStorage.setItem('printou_channels', JSON.stringify(imported.channels));
                                                            if (imported.suppliers) localStorage.setItem('printou_suppliers', JSON.stringify(imported.suppliers));
                                                            if (imported.expenses) localStorage.setItem('printou_expenses', JSON.stringify(imported.expenses));
                                                            if (imported.filaments) localStorage.setItem('printou_filaments', JSON.stringify(imported.filaments));
                                                        } catch (errLocal) {
                                                            console.warn("Aviso: Limite de armazenamento LocalStorage excedido ao restaurar backup. Os dados serão carregados do servidor.", errLocal);
                                                        }
                                                        
                                                        await fetch('/api/data', {
                                                            method: 'POST',
                                                            headers: { 'Content-Type': 'application/json' },
                                                            body: JSON.stringify(imported)
                                                        });
                                                        
                                                        alert("Backup restaurado com sucesso! A página será atualizada.");
                                                        window.location.reload();
                                                    }
                                                } else {
                                                    alert("Arquivo inválido. Formato de backup incorreto.");
                                                }
                                            } catch (err) {
                                                alert("Erro ao ler o arquivo de backup.");
                                            }
                                        };
                                        reader.readAsText(file);
                                    }}
                                    className="hidden"
                                />
                            </label>
                        </div>
                    </div>
                </div>
            );
        }

        // --- VIEW DE RELATÓRIOS & INSIGHTS ---
        function ReportsView({ sales, products, channels, compute, selectedMonth, expenses, monthlyClosings = [], setMonthlyClosings }) {
            const [subTab, setSubTab] = useState('dre'); // 'dre' ou 'fechamentos'
            const [isClosing, setIsClosing] = useState(false);

            // Cálculo de produtos mais vendidos
            const topProducts = useMemo(() => {
                const map = {};
                sales.forEach(sale => {
                    if (sale.status !== 'Cancelado') {
                        map[sale.productId] = (map[sale.productId] || 0) + sale.quantity;
                    }
                });
                return Object.entries(map).map(([id, qty]) => {
                    const prod = products.find(p => p.id === id);
                    return { name: prod?.name || 'Excluído', qty };
                }).sort((a, b) => b.qty - a.qty).slice(0, 5);
            }, [sales, products]);

            // Margem por produto (ajustado para suportar revenda e 3d dinamicamente)
            const bestMargins = useMemo(() => {
                return products.map(prod => {
                    const cost = prod.type === 'resale' 
                        ? (prod.acquisitionCost || 0)
                        : ((prod.weight * prod.filamentCost) / 1000 + (prod.printTime * prod.machineHourCost) + prod.finishingCost + prod.packagingCost);
                    const defaultSaleValue = 60.0;
                    const averageFee = (defaultSaleValue * 0.12) + 4.0;
                    const estimatedProfit = defaultSaleValue - averageFee - cost;
                    const marginPercent = defaultSaleValue > 0 ? (estimatedProfit / defaultSaleValue) * 100 : 0;
                    return { name: prod.name, margin: marginPercent, profit: estimatedProfit, cost };
                }).sort((a, b) => b.margin - a.margin);
            }, [products]);

            // Divisão de Vendas por Canal
            const channelStats = useMemo(() => {
                const stats = {};
                sales.forEach(sale => {
                    if (sale.status !== 'Cancelado') {
                        stats[sale.channelId] = (stats[sale.channelId] || 0) + 1;
                    }
                });
                return Object.entries(stats).map(([id, count]) => {
                    const chan = channels.find(c => c.id === id);
                    return { name: chan?.name || 'Outro', count, color: chan?.color || '#888' };
                });
            }, [sales, channels]);

            // --- CÁLCULOS DO DRE DO MÊS SELECIONADO ---
            const dreStats = useMemo(() => {
                let totalGross = 0;
                let totalCost = 0;
                let totalFees = 0;
                let totalShipping = 0;
                let activeSalesCount = 0;

                const filteredSales = sales.filter(s => s.date.startsWith(selectedMonth));
                filteredSales.forEach(sale => {
                    if (sale.status !== 'Cancelado') {
                        const fin = compute(sale);
                        totalGross += sale.grossValue;
                        totalCost += fin.productCost;
                        totalFees += fin.fees;
                        totalShipping += (fin.shippingApplied || 0);
                        activeSalesCount++;
                    }
                });

                const filteredExpenses = expenses.filter(e => e.competency === selectedMonth && e.category !== 'Matéria-Prima');
                const totalAdmExpenses = filteredExpenses.reduce((acc, curr) => acc + curr.value, 0);

                const netProfitVendas = totalGross - totalFees - totalCost - totalShipping;
                const companyRealNet = netProfitVendas - totalAdmExpenses;

                return {
                    gross: totalGross,
                    cost: totalCost,
                    fees: totalFees,
                    shipping: totalShipping,
                    admExpenses: totalAdmExpenses,
                    salesProfit: netProfitVendas,
                    realNet: companyRealNet,
                    count: activeSalesCount
                };
            }, [sales, products, channels, expenses, selectedMonth, compute]);

            const handleExportCSV = () => {
                let csv = "Data,Canal,Produto,Quantidade,Valor Bruto,Comissao,Frete,Lucro Liquido\n";
                sales.forEach(sale => {
                    const prod = findProduct(sale.productId);
                    const chan = channels.find(c => c.id === sale.channelId);
                    const fin = compute(sale);
                    csv += `${sale.date},"${chan?.name || 'Excluido'}","${prod?.name || 'Excluido'}",${sale.quantity},${sale.grossValue},${fin.fees.toFixed(2)},${sale.shipping},${fin.netProfit}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `printou_relatorio_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleExportConsolidatedCSV = () => {
                let csv = `DEMONSTRATIVO DE RESULTADO (DRE) - COMPETENCIA: ${selectedMonth}\n\n`;
                csv += "Indicador,Valor\n";
                csv += `(+) Receita Bruta (Faturamento),${dreStats.gross.toFixed(2)}\n`;
                csv += `(-) Taxas de Canal (Comissoes),-${dreStats.fees.toFixed(2)}\n`;
                csv += `(-) Custos de Envio (Fretes),-${dreStats.shipping.toFixed(2)}\n`;
                csv += `(-) Custos de Fabricacao / Aquisicao,-${dreStats.cost.toFixed(2)}\n`;
                csv += `(=) Margem Operacional de Vendas,${dreStats.salesProfit.toFixed(2)}\n`;
                csv += `(-) Despesas Administrativas Fixas,-${dreStats.admExpenses.toFixed(2)}\n`;
                csv += `(=) Resultado Liquido Real,${dreStats.realNet.toFixed(2)}\n`;
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `printou_dre_${selectedMonth}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="space-y-8">
                    <div className="flex justify-between items-center">
                        <div>
                            <span className="text-xs font-bold tracking-widest text-brand-orange uppercase">Inteligência</span>
                            <h3 className="font-black text-2xl text-gradient">Relatórios & Insights de Operação</h3>
                        </div>
                        <button 
                            onClick={handleExportCSV}
                            className="bg-[#16161A] border border-emerald-500/30 hover:bg-emerald-500/10 text-emerald-400 font-bold px-6 py-2.5 rounded-xl text-sm transition-all"
                        >
                            Exportar Relatório Geral (CSV)
                        </button>
                    </div>

                    {/* Sub-navegação interna */}
                    <div className="flex gap-4 border-b border-white/5 pb-2">
                        <button 
                            onClick={() => setSubTab('dre')}
                            className={`pb-2 px-1 text-sm font-bold transition-all relative ${
                                subTab === 'dre' 
                                    ? 'text-brand-orange border-b-2 border-brand-orange' 
                                    : 'text-gray-400 hover:text-white'
                            }`}
                        >
                            📊 Demonstrativo de Resultados (DRE)
                        </button>
                        <button 
                            onClick={() => setSubTab('fechamentos')}
                            className={`pb-2 px-1 text-sm font-bold transition-all relative ${
                                subTab === 'fechamentos' 
                                    ? 'text-brand-orange border-b-2 border-brand-orange font-extrabold' 
                                    : 'text-gray-400 hover:text-white'
                            }`}
                        >
                            🔒 Fechamento Mensal e Inventário
                        </button>
                    </div>

                    {subTab === 'dre' ? (
                        <>
                            {/* Demonstrativo de Resultado Consolidado (DRE) */}
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center border-b border-white/5 pb-4">
                                    <h4 className="font-extrabold text-white text-lg flex items-center gap-2">
                                        📊 Demonstrativo Consolidado (DRE) - {selectedMonth}
                                    </h4>
                                    <button 
                                        onClick={handleExportConsolidatedCSV}
                                        className="bg-emerald-500/10 border border-emerald-500/30 hover:bg-emerald-500/20 text-emerald-400 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all"
                                    >
                                        📥 Exportar DRE (CSV)
                                    </button>
                                </div>

                                <div className="space-y-4 text-sm">
                                    <div className="flex justify-between border-b border-white/5 pb-2 text-gray-300">
                                        <span>(+) Receita Bruta (Faturamento)</span>
                                        <span className="font-bold text-white">R$ {dreStats.gross.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-white/5 pb-2 text-gray-300">
                                        <span>(-) Taxas de Canal (Comissões)</span>
                                        <span className="font-semibold text-rose-400">- R$ {dreStats.fees.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-white/5 pb-2 text-gray-300">
                                        <span>(-) Custos de Envio (Fretes Vendedor)</span>
                                        <span className="font-semibold text-rose-400">- R$ {dreStats.shipping.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-white/5 pb-2 text-gray-300">
                                        <span>(-) Custos de Fabricação / Aquisição</span>
                                        <span className="font-semibold text-rose-400">- R$ {dreStats.cost.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-white/10 pb-2 font-bold text-emerald-400">
                                        <span>(=) Margem Operacional de Vendas</span>
                                        <span>R$ {dreStats.salesProfit.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-white/5 pb-2 text-gray-300">
                                        <span>(-) Despesas Administrativas Fixas</span>
                                        <span className="font-semibold text-rose-400">- R$ {dreStats.admExpenses.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between pt-2 text-lg font-black border-t border-brand-orange/30">
                                        <span>(=) Resultado Líquido Real</span>
                                        <span className={dreStats.realNet >= 0 ? "text-brand-orange" : "text-rose-500"}>
                                            R$ {dreStats.realNet.toFixed(2)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-fade-in">
                                {/* Mais Vendidos */}
                                <div className="glass-panel p-6 rounded-2xl">
                                    <h4 className="font-extrabold text-white text-lg mb-6 flex items-center gap-2">
                                        🏆 Modelos Mais Vendidos (Qtd.)
                                    </h4>
                                    <div className="space-y-4">
                                        {topProducts.length === 0 ? (
                                            <p className="text-gray-500 text-sm">Nenhuma venda paga registrada ainda.</p>
                                        ) : topProducts.map((p, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                                                <span className="font-bold text-gray-300"><span className="text-brand-orange">#{idx+1}</span> {p.name}</span>
                                                <span className="text-sm font-black text-white">{p.qty} unidades</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Melhores Margens */}
                                <div className="glass-panel p-6 rounded-2xl">
                                    <h4 className="font-extrabold text-white text-lg mb-6 flex items-center gap-2">
                                        💸 Produtos com Melhores Margens Estimadas
                                    </h4>
                                    <div className="space-y-4">
                                        {bestMargins.map((p, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                                                <div>
                                                    <span className="font-bold text-gray-300 block">{p.name}</span>
                                                    <span className="text-[10px] text-gray-500">Custo Fabricação: R$ {p.cost.toFixed(2)}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-sm font-black text-emerald-400 block">{p.margin.toFixed(1)}%</span>
                                                    <span className="text-[10px] text-gray-400">Margem Estimada</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Estatísticas de Canais */}
                            <div className="glass-panel p-6 rounded-2xl animate-fade-in">
                                <h4 className="font-extrabold text-white text-lg mb-6">
                                    📊 Distribuição de Vendas por Canal
                                </h4>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    {channelStats.map((c, idx) => (
                                        <div key={idx} className="p-4 rounded-xl bg-[#121215] border border-white/5 text-center">
                                            <span className="w-3 h-3 rounded-full inline-block mb-2" style={{ backgroundColor: c.color }}></span>
                                            <p className="text-xs text-gray-400 font-bold uppercase truncate">{c.name}</p>
                                            <p className="text-xl font-black text-white mt-1">{c.count} Vendas</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </>
                    ) : (
                        <div className="space-y-6 animate-fade-in">
                            {/* Visualização de Fechamento */}
                            {monthlyClosings.some(c => c.month === selectedMonth) ? (
                                (() => {
                                    const closing = monthlyClosings.find(c => c.month === selectedMonth);
                                    return (
                                        <div className="space-y-6">
                                            {/* Cabeçalho de Fechado */}
                                            <div className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                <div>
                                                    <h4 className="font-black text-emerald-400 text-lg flex items-center gap-2">
                                                        🔒 Mês Fechado Financeiramente
                                                    </h4>
                                                    <p className="text-xs text-gray-400 mt-1">Este mês está consolidado e bloqueado para modificações.</p>
                                                </div>
                                                <div className="text-xs text-gray-400 text-right">
                                                    Fechado em: <strong className="text-white">{new Date(closing.closedAt).toLocaleDateString()} às {new Date(closing.closedAt).toLocaleTimeString()}</strong>
                                                </div>
                                            </div>

                                            {/* Indicadores Consolidados */}
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                                <div className="glass-panel p-4 rounded-xl border border-white/5 text-center">
                                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Faturamento Bruto</span>
                                                    <h5 className="text-lg font-black text-white mt-1">R$ {closing.grossRevenue.toFixed(2)}</h5>
                                                </div>
                                                <div className="glass-panel p-4 rounded-xl border border-white/5 text-center">
                                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Lucro das Vendas</span>
                                                    <h5 className="text-lg font-black text-emerald-400 mt-1">R$ {closing.netProfit.toFixed(2)}</h5>
                                                </div>
                                                <div className="glass-panel p-4 rounded-xl border border-white/5 text-center">
                                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Despesas Fixas</span>
                                                    <h5 className="text-lg font-black text-rose-400 mt-1">R$ {closing.totalExpenses.toFixed(2)}</h5>
                                                </div>
                                                <div className="glass-panel p-4 rounded-xl border border-white/5 text-center">
                                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Resultado Real</span>
                                                    <h5 className={`text-lg font-black mt-1 ${closing.realNet >= 0 ? 'text-brand-orange' : 'text-rose-500'}`}>R$ {closing.realNet.toFixed(2)}</h5>
                                                </div>
                                            </div>

                                            {/* Inventário do Fechamento */}
                                            <div className="glass-panel border border-white/5 rounded-2xl overflow-hidden shadow-xl">
                                                <div className="p-4 bg-[#171720] border-b border-white/5 flex justify-between items-center">
                                                    <h5 className="font-extrabold text-white text-sm uppercase tracking-wider">📦 Foto do Estoque Gravada no Fechamento</h5>
                                                    <span className="text-xs text-gray-400 font-medium">Quantidade total de itens e valor de custo estáticos da data.</span>
                                                </div>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left text-sm text-gray-300">
                                                        <thead className="bg-[#121215] border-b border-white/5 text-[10px] font-extrabold uppercase tracking-widest text-gray-500">
                                                            <tr>
                                                                <th className="py-3 px-4">SKU</th>
                                                                <th className="py-3 px-4">Produto</th>
                                                                <th className="py-3 px-4 text-center">Quantidade Salva</th>
                                                                <th className="py-3 px-4 text-center">Custo Unitário</th>
                                                                <th className="py-3 px-4 text-right">Valor Total de Custo</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-white/5">
                                                            {closing.stockSnapshot && closing.stockSnapshot.length > 0 ? (
                                                                closing.stockSnapshot.map((item, idx) => (
                                                                    <tr key={idx} className="hover:bg-white/5 transition-all text-xs">
                                                                        <td className="py-3 px-4 font-mono text-gray-400">{item.productId}</td>
                                                                        <td className="py-3 px-4 font-bold text-white">{item.productName}</td>
                                                                        <td className="py-3 px-4 text-center text-gray-200">{item.stockQty} un</td>
                                                                        <td className="py-3 px-4 text-center text-gray-300">R$ {Number(item.unitCost || 0).toFixed(2)}</td>
                                                                        <td className="py-3 px-4 text-right font-bold text-white">R$ {Number(item.totalStockValue || 0).toFixed(2)}</td>

                                                                    const cost = compute ? 0 : (p.acquisitionCost || 0); // we will call calculateCost helper or compute unitCost
                                                                    const calculatedUnitCost = p.type === 'resale' ? (p.acquisitionCost || 0) : ((p.weight * p.filamentCost) / 1000 + (p.printTime * p.machineHourCost) + p.finishingCost + p.packagingCost);

        // --- ABA EXTRA: FACEBOOK MARKETPLACE AGENT ---
        function FacebookMarketplaceView() {
            const [activeTab, setActiveTab] = useState('catalog'); // 'catalog', 'messages', 'config'
            const [shopifyProducts, setShopifyProducts] = useState([]);
            const [messages, setMessages] = useState([]);
            const [config, setConfig] = useState({
                accessToken: '',
                pageId: '1117637594770324',
                businessId: '1550133536629313',
                catalogId: '',
                status: 'Não Sincronizado'
            });

            const [isLoadingProducts, setIsLoadingProducts] = useState(false);
            const [isLoadingMessages, setIsLoadingMessages] = useState(false);
            const [isSavingConfig, setIsSavingConfig] = useState(false);
            const [publishingId, setPublishingId] = useState(null);
            const [selectedMessage, setSelectedMessage] = useState(null);
            const [replyText, setReplyText] = useState('');
            const [successMessage, setSuccessMessage] = useState('');
            const [errorMessage, setErrorMessage] = useState('');

            useEffect(() => {
                fetchConfig();
                fetchProducts();
                fetchMessages();
            }, []);

            useEffect(() => {
                // Atualiza os ícones do Lucide sempre que a aba ativa mudar
                setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
            }, [activeTab, shopifyProducts, messages, selectedMessage]);

            const showMessage = (msg, isError = false) => {
                if (isError) {
                    setErrorMessage(msg);
                    setTimeout(() => setErrorMessage(''), 5000);
                } else {
                    setSuccessMessage(msg);
                    setTimeout(() => setSuccessMessage(''), 5000);
                }
            };

            const fetchConfig = async () => {
                try {
                    const res = await fetch('/api/facebook/config');
                    if (res.ok) {
                        const data = await res.json();
                        setConfig(data);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchProducts = async () => {
                setIsLoadingProducts(true);
                try {
                    const res = await fetch('/api/facebook/products');
                    if (res.ok) {
                        const data = await res.json();
                        setShopifyProducts(data);
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setIsLoadingProducts(false);
                }
            };

            const fetchMessages = async () => {
                setIsLoadingMessages(true);
                try {
                    const res = await fetch('/api/facebook/messages');
                    if (res.ok) {
                        const data = await res.json();
                        setMessages(data);
                        if (data.length > 0 && !selectedMessage) {
                            setSelectedMessage(data[0]);
                        }
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setIsLoadingMessages(false);
                }
            };

            const handleSaveConfig = async (e) => {
                e.preventDefault();
                setIsSavingConfig(true);
                try {
                    const res = await fetch('/api/facebook/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    if (res.ok) {
                        const r = await res.json();
                        setConfig(r.config);
                        showMessage("Configurações do Meta integradas com sucesso!");
                    } else {
                        showMessage("Erro ao salvar configurações.", true);
                    }
                } catch (e) {
                    showMessage(e.message, true);
                } finally {
                    setIsSavingConfig(false);
                }
            };

            const handleSyncShopify = async () => {
                setIsLoadingProducts(true);
                try {
                    // Tenta via servidor primeiro
                    const res = await fetch('/api/facebook/sync-shopify', { method: 'POST' });
                    const data = res.ok ? await res.json() : null;

                    if (data && data.success) {
                        showMessage(`Sincronização concluída via servidor! ${data.imported} novos produtos importados.`);
                        fetchProducts();
                        return;
                    }

                    // Fallback: Sincronização direta pelo navegador usando o feed público
                    console.log("[SHOPIFY-FALLBACK] Sincronização via servidor falhou. Iniciando busca direta pelo navegador...");
                    
                    const clientRes = await fetch('https://printoustudio3d.com/products.json?limit=100');
                    if (!clientRes.ok) {
                        throw new Error("Não foi possível acessar o feed público de produtos do site.");
                    }

                    const clientData = await clientRes.json();
                    if (!clientData.products || clientData.products.length === 0) {
                        throw new Error("Nenhum produto exposto no feed público do site.");
                    }

                    // Envia os produtos para o servidor salvar no banco
                    const saveRes = await fetch('/api/facebook/save-shopify-products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ products: clientData.products })
                    });

                    if (saveRes.ok) {
                        const saveData = await saveRes.json();
                        showMessage(`Sincronização concluída via navegador! ${saveData.imported} novos produtos importados.`);
                        fetchProducts();
                    } else {
                        const saveErr = await saveRes.json();
                        throw new Error(saveErr.error || "Erro ao salvar produtos no servidor.");
                    }
                } catch (e) {
                    console.error("[SHOPIFY-FALLBACK-ERR]", e);
                    showMessage("Erro na sincronização: " + e.message, true);
                } finally {
                    setIsLoadingProducts(false);
                }
            };

            const handleDeleteProduct = async (id) => {
                if (!confirm("Deseja remover este produto do painel do Facebook Marketplace?")) return;
                try {
                    const res = await fetch(`/api/facebook/products/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        showMessage("Produto removido com sucesso!");
                        fetchProducts();
                    } else {
                        const data = await res.json();
                        showMessage(data.error || "Erro ao remover o produto.", true);

                    showMessage(e.message, true);
