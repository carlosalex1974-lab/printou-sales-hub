                        body: JSON.stringify({ productId: id })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showMessage(data.message || "Anúncio publicado com sucesso!");
                        fetchProducts();
                        fetchMessages(); // Atualiza para carregar mensagens simuladas se houver

                        showMessage(data.error || "Erro ao publicar no Facebook.", true);

                    showMessage(e.message, true);

                    setPublishingId(null);
                }

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messageId: selectedMessage.id, replyText })

                        showMessage("Resposta enviada com sucesso!");

                        fetchMessages();
                        setSelectedMessage(prev => prev ? { ...prev, replied: true, replyText } : null);
                    } else {
                        showMessage("Erro ao enviar resposta.", true);
                    }

                    showMessage(e.message, true);
                }

                            <div className="md:col-span-2 glass-panel rounded-2xl border border-white/5 flex flex-col justify-between overflow-hidden">

                                            <a

                                            >
                                                Ver no Site
                                                <span className="text-xs">🔗</span>
                                            </a>
                                        </div>

                                        <div className="flex-1 p-6 overflow-y-auto space-y-4">
                                            {/* Mensagem do Comprador */}
                                            <div className="flex items-start gap-3 max-w-[80%]">
                                                <div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold text-xs text-white">
                                                    {selectedMessage.buyerName.substring(0, 1)}
                                                </div>
                                                <div className="bg-[#1C1C22] border border-white/5 rounded-2xl p-4 text-xs text-gray-300">
                                                    {selectedMessage.messageText}
                                                </div>
                                            </div>

                                            {/* Resposta do Agente */}
                                            {selectedMessage.replied && (
                                                <div className="flex items-start gap-3 max-w-[80%] ml-auto flex-row-reverse">
                                                    <div className="w-8 h-8 rounded-full bg-[#7C3AED] flex items-center justify-center font-bold text-xs text-black">
                                                        IA
                                                    </div>
                                                    <div className="bg-[#7C3AED]/10 border border-[#7C3AED]/20 rounded-2xl p-4 text-xs text-white">
                                                        {selectedMessage.replyText}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="p-4 border-t border-brand-borderBg bg-white/2 space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[9px] text-gray-500 font-extrabold uppercase">Escrever resposta</span>
                                                <button 
                                                    onClick={generateAIReply}
                                                    className="bg-[#7C3AED]/10 hover:bg-[#7C3AED]/20 text-[#7C3AED] border border-[#7C3AED]/30 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-1.5 transition-all"

                                                    Gerar com IA Kika

                                                    className="flex-1 bg-[#16161A] border border-brand-borderBg text-white rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-brand-orange"
                                                />
                                                <button

                                                    disabled={!replyText.trim()}

                                        Selecione uma conversa na barra lateral.
                                    </div>

                        </div>

                    {/* ABA: CONFIGURAÇÕES */}
                    {activeTab === 'config' && (
                        <div className="max-w-2xl glass-panel p-8 rounded-2xl border border-white/5 animate-fade-in">
                            <div className="mb-6">
                                <h4 className="font-extrabold text-white text-base">Credenciais da API do Facebook (Meta)</h4>
                                <p className="text-xs text-gray-500 mt-1">Insira as credenciais do seu aplicativo Meta Business para liberar publicações de catálogo automáticas.</p>

                            <form onSubmit={handleSaveConfig} className="space-y-4">

                                        />
                                    </div>
                                </div>

                                    <input

                                        placeholder="Insira o ID do catálogo comercial do Facebook..."
                                        value={config.catalogId}
                                        onChange={e => setConfig({ ...config, catalogId: e.target.value })}

                                    <textarea

                                        onChange={e => setConfig({ ...config, accessToken: e.target.value })}

                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-mono"
                                    />

                                <button

        }

        // --- ABA 9: CONTROLE DE ESTOQUE SIMPLES & DIRETO (PRODUTOS) ---
        function EstoqueView({ products = [], setProducts, calculateCost, suppliers = [], setStockEntry, setStockExit, stockMovements = [], setStockMovements }) {
            const [isAdding, setIsAdding] = useState(false);
            const [search, setSearch] = useState('');
            const [filterType, setFilterType] = useState('all');
            const [filterLowStock, setFilterLowStock] = useState(false);

            const [editingItem, setEditingItem] = useState(null);

            const [newItem, setNewItem] = useState({
                name: '',
                sku: '',
                description: '',
                type: 'resale', // resale ou 3d
                stock: '0',
                alertThreshold: '3',
                acquisitionCost: '0.00',
                price: '0.00',
                supplierId: '',
                image: ''
            });

            const handleStartEdit = (prod) => {
                setEditingItem(prod);
                setIsAdding(true);
                setNewItem({
                    name: prod.name,
                    sku: prod.id,
                    description: prod.description || '',
                    type: prod.type || 'resale',
                    stock: String(prod.stock || 0),
                    alertThreshold: String(prod.alertThreshold || 3),
                    acquisitionCost: String(prod.acquisitionCost || 0),
                    price: String(prod.price || 0),
                    supplierId: prod.supplierId || '',
                    image: prod.image || ''
                });
            };

            const handleDeleteStockItem = (id) => {
                if (confirm("Deseja realmente excluir este item do estoque?")) {
                    mutateServer('products', 'delete', null, id);
                    setProducts(prev => prev.filter(p => p.id !== id));
                    alert("Produto excluído com sucesso!");
                }
            };

            // Adicionar ou editar item (Produto) diretamente pelo estoque
            const handleSaveItem = (e) => {
                e.preventDefault();
                const skuCode = newItem.sku.trim() || 'PRD-' + Date.now().toString().slice(-6);
                
                if (editingItem) {
                    // Editar produto existente
                    const updatedProd = {
                        ...editingItem, // keep existing fields we aren't changing
                        id: skuCode,
                        name: newItem.name,
                        description: newItem.description,
                        type: newItem.type,
                        acquisitionCost: parseFloat(newItem.acquisitionCost) || 0,
                        price: parseFloat(newItem.price) || 0,
                        stock: parseInt(newItem.stock) || 0,
                        alertThreshold: parseInt(newItem.alertThreshold) || 3,
                        supplierId: newItem.supplierId,
                        image: newItem.image || editingItem.image || ''
                    };
                    
                    mutateServer('products', 'update', updatedProd);
                    setProducts(prev => prev.map(p => p.id === editingItem.id ? updatedProd : p));
                    
                    setEditingItem(null);
                    alert("Produto atualizado com sucesso!");
                } else {
                    // Cadastrar novo
                    const prod = {
                        id: skuCode,
                        name: newItem.name,
                        description: newItem.description,
                        type: newItem.type,
                        weight: newItem.type === '3d' ? 150 : 0,
                        printTime: newItem.type === '3d' ? 2 : 0,
                        filamentCost: newItem.type === '3d' ? parseFloat(newItem.acquisitionCost) : 0,
                        machineHourCost: newItem.type === '3d' ? 2.00 : 0,
                        finishingCost: 0,
                        packagingCost: 0,
                        failRate: 0,
                        acquisitionCost: parseFloat(newItem.acquisitionCost) || 0,
                        price: parseFloat(newItem.price) || 0,
                        stock: parseInt(newItem.stock) || 0,
                        customShippingCost: 0,
                        supplierId: newItem.supplierId,
                        image: newItem.image || ''
                    };

                    mutateServer('products', 'add', prod);
                    setProducts([...products, prod]);

                    if (prod.stock > 0) {
                        const movement = {
                            id: 'mov-' + Date.now() + Math.random().toString(36).substr(2, 4),
                            timestamp: new Date().toISOString(),
                            type: 'entrada',
                            itemName: prod.name,
                            qty: prod.stock,
                            unit: 'un',
                            reason: 'Saldo Inicial de Cadastro'
                        };
                        setStockMovements(prev => [movement, ...prev]);
                    }
                    alert("Produto cadastrado no estoque com sucesso!");
                }

                setIsAdding(false);
                setNewItem({
                    name: '',
                    sku: '',
                    description: '',
                    type: 'resale',
                    stock: '0',
                    alertThreshold: '3',
                    acquisitionCost: '0.00',
                    price: '0.00',
                    supplierId: '',
                    image: ''
                });
            };

            // Ajuste manual rápido de estoque via input
            const handleAdjustStock = (id, newStock) => {
                const val = parseInt(newStock);
                if (!isNaN(val) && val >= 0) {
                    const prodInfo = products.find(p => p.id === id);
                    if (prodInfo) {
                        const oldStock = prodInfo.stock || 0;
                        if (oldStock === val) return;

                        // Registrar a movimentação
                        const diff = val - oldStock;
                        const movement = {
                            id: 'mov-' + Date.now() + Math.random().toString(36).substr(2, 4),
                            timestamp: new Date().toISOString(),
                            type: diff > 0 ? 'entrada' : 'saida',
                            itemName: prodInfo.name,
                            qty: Math.abs(diff),
                            unit: 'un',
                            reason: `Ajuste rápido (de ${oldStock} para ${val})`
                        };
                        setStockMovements(prev => [movement, ...prev]);

                        setProducts(prevProds => prevProds.map(p => p.id === id ? { ...p, stock: val } : p));
                    }
                }
            };

            const handleDelete = (id) => {
                if (confirm("Deseja realmente remover este produto do catálogo e do estoque?")) {
                    mutateServer('products', 'delete', null, id);
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            const filteredProducts = useMemo(() => {
                return products.filter(prod => {
                    const matchesSearch = prod.name.toLowerCase().includes(search.toLowerCase()) || 
                                          prod.id.toLowerCase().includes(search.toLowerCase());
                    const matchesType = filterType === 'all' || prod.type === filterType;
                    const matchesLow = !filterLowStock || (prod.stock || 0) <= (prod.alertThreshold || 3);
                    return matchesSearch && matchesType && matchesLow;
                });
            }, [products, search, filterType, filterLowStock]);

            const totalItems = products.reduce((acc, p) => acc + (parseInt(p.stock) || 0), 0);
            const totalInvested = products.reduce((acc, p) => acc + ((parseInt(p.stock) || 0) * (calculateCost ? calculateCost(p) : 0)), 0);

            const handlePullStock = async () => {
                try {
                    const btn = document.getElementById('btn-pull-ml');
                    if (btn) btn.innerHTML = '⏳ Puxando...';
                    
                    const res = await fetch('/api/sync-ml-stock');
                    const data = await res.json();
                    
                    if (data.success) {
                        alert(data.message);
                        window.location.reload();
                    } else {
                        alert('Erro ao puxar estoque: ' + data.error);
                        if (btn) btn.innerHTML = '🔄 Puxar Estoque do ML';
                    }
                } catch (e) {
                    alert('Erro de conexão com o servidor ao sincronizar.');
                    const btn = document.getElementById('btn-pull-ml');
                    if (btn) btn.innerHTML = '🔄 Puxar Estoque do ML';
                }
            };


            return (
                <div className="space-y-6">
                    {/* Cabeçalho */}
                    <div className="flex justify-between items-center">
                        <div>
                            
                                <h2 className="text-2xl font-black text-white">Controle de Estoque & Inventário</h2>
                                <p className="text-gray-400 text-xs mt-1">Gerencie a entrada, saída, custos e níveis de estoque dos seus produtos de forma simples e direta por unidade.</p>
                            </div>
                            <div className="flex gap-4 items-center">
                                <div className="bg-[#16161A] border border-white/5 px-4 py-2 rounded-xl text-right">
                                    <span className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">Total em Estoque</span>
                                    <span className="text-sm font-black text-white">{totalItems} unidades</span>
                                </div>
                                <div className="bg-brand-orange/10 border border-brand-orange/20 px-4 py-2 rounded-xl text-right">
                                    <span className="block text-[10px] font-bold text-brand-orange uppercase tracking-widest">Valor Investido</span>
                                    <span className="text-sm font-black text-brand-orange">R$ {totalInvested.toFixed(2)}</span>
                                </div>
                                <button 
                                    id="btn-pull-ml"
                                    onClick={handlePullStock}
                                    className="bg-blue-600 hover:bg-blue-500 text-white font-extrabold px-4 py-3 rounded-xl transition-all shadow-lg text-xs tracking-wider flex items-center gap-2"
                                >
                                    🔄 Puxar Estoque do ML
                                </button>
                                <button 
                                    onClick={() => setIsAdding(!isAdding)}
                                    className="bg-brand-orange hover:bg-brand-orange-dark text-black font-extrabold px-6 py-3 rounded-xl transition-all shadow-lg text-xs uppercase tracking-wider"
                                >
                                    {isAdding ? 'Fechar Painel' : '+ Cadastrar Novo Item'}
                                </button>
                            </div></div>

                    {/* Painel de Cadastro Simplificado */}
                    {isAdding && (
                        <div className="glass-panel border border-brand-orange/30 p-6 rounded-2xl animate-fade-in">
                            <h3 className="text-base font-extrabold text-white uppercase tracking-wider mb-6 flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-brand-orange"></span>
                                {editingItem ? `✏️ Editar Item do Estoque (SKU: ${editingItem.id})` : "Cadastrar Novo Item no Estoque"}
                            </h3>
                            <form onSubmit={handleSaveItem} className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Nome do Produto / Item *</label>
                                    <input 
                                        type="text" required placeholder="Ex: Action Figure Groot, Caixa de Resina, etc."
                                        value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Código do Fornecedor / SKU / ID</label>
                                    <input 
                                        type="text" placeholder="Gere automático ou insira ex: GRT-01"
                                        value={newItem.sku} onChange={e => setNewItem({...newItem, sku: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-mono"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Tipo de Produto *</label>
                                    <select 
                                        value={newItem.type} onChange={e => setNewItem({...newItem, type: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                                    >
                                        <option value="resale">Revenda Geral (Compra e Venda)</option>
                                        <option value="3d">Impressão 3D (Fabricação)</option>
                                    </select>
                                </div>
                                
                                <div className="md:col-span-3">
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Descrição / Detalhes do Produto</label>
                                    <input 
                                        type="text" placeholder="Características, material, observações, etc."
                                        value={newItem.description} onChange={e => setNewItem({...newItem, description: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Quantidade Inicial (unidades)</label>
                                    <input 
                                        type="number" required min="0"
                                        value={newItem.stock} onChange={e => setNewItem({...newItem, stock: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Estoque Mínimo (Alerta Crítico)</label>
                                    <input 
                                        type="number" required min="0"
                                        value={newItem.alertThreshold} onChange={e => setNewItem({...newItem, alertThreshold: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Fornecedor</label>
                                    <select 
                                        value={newItem.supplierId} onChange={e => setNewItem({...newItem, supplierId: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs"
                                    >
                                        <option value="">Selecione o Fornecedor...</option>
                                        {suppliers.map(sup => (
                                            <option key={sup.id} value={sup.name}>{sup.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Preço de Custo Unitário (R$)</label>
                                    <input 
                                        type="number" required step="0.01" min="0"
                                        value={newItem.acquisitionCost} onChange={e => setNewItem({...newItem, acquisitionCost: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold text-emerald-400"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Preço de Venda Sugerido (R$)</label>
                                    <input 
                                        type="number" required step="0.01" min="0"
                                        value={newItem.price} onChange={e => setNewItem({...newItem, price: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold text-brand-orange"
                                    />
                                </div>

                                <div className="md:col-span-3 flex justify-end gap-3 mt-4">
                                    <button 
                                        type="button" onClick={() => { setIsAdding(false); setEditingItem(null); }}
                                        className="bg-transparent border border-white/10 hover:bg-white/5 text-gray-400 hover:text-white px-6 py-3 rounded-xl transition-all text-xs font-bold uppercase tracking-wider"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        type="submit"
                                        className="bg-brand-orange hover:bg-brand-orange-dark text-black px-8 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all"
                                    >
                                        {editingItem ? 'Salvar Alterações' : 'Confirmar Cadastro'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Filtros e Busca */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                        <div className="md:col-span-2 relative">
                            <input 
                                type="text"
                                placeholder="Buscar por código ou nome do produto..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-brand-orange text-xs font-bold"
                            />
                            <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                        </div>

                        <div>
                            <select 
                                value={filterType}
                                onChange={e => setFilterType(e.target.value)}
                                className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-xs font-bold"

            // --- ABA 8.5: CAIXA E BANCOS ---
            function CashflowView({ accounts = [], setAccounts, transactions = [], setTransactions, sales = [], channels = [] }) {
                const [isTransferring, setIsTransferring] = useState(false);
                const [isAddingTransaction, setIsAddingTransaction] = useState(false);
                const [transferData, setTransferData] = useState({ amount: '', date: new Date().toISOString().substring(0, 10), from: 'mercado-pago', to: 'caixa-principal' });
                const [transactionData, setTransactionData] = useState({ type: 'IN', amount: '', date: new Date().toISOString().substring(0, 10), description: '', accountId: 'caixa-principal' });
                const [editingTxId, setEditingTxId] = useState(null);
                const [editTxData, setEditTxData] = useState(null);
                const handleEditClick = (tx) => { setEditingTxId(tx.id); setEditTxData({ ...tx, date: new Date(tx.date).toISOString().substring(0, 10) }); };
                const handleCancelEdit = () => { setEditingTxId(null); setEditTxData(null); };
                const handleSaveEdit = async () => {
                    if (!editTxData.amount || isNaN(editTxData.amount) || editTxData.amount <= 0 || !editTxData.description) return alert('Preencha os campos obrigat�rios');
                    try {
                        const res = await fetch(`/api/transactions/${editingTxId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...editTxData, amount: parseFloat(editTxData.amount) }) });
                        if (res.ok) { const data = await res.json(); setTransactions(transactions.map(t => t.id === editingTxId ? data.transaction : t)); setEditingTxId(null); setEditTxData(null); }
                    } catch (e) { console.error(e); alert('Erro ao atualizar'); }
                };
                const handleDeleteTx = async (id) => {
                    if (!confirm('Deseja realmente apagar esta transa��o?')) return;
                    try {
                        const res = await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                        if (res.ok) { setTransactions(transactions.filter(t => t.id !== id)); }
                    } catch (e) { console.error(e); alert('Erro ao excluir'); }
                };

                // Calcula os saldos
                const mlSalesTotal = sales.filter(s => s.status === 'Pago' || s.status === 'Enviado' || s.status === 'Entregue').reduce((acc, sale) => {
                    const c = channels.find(ch => ch.id === sale.channelId);
                    const gross = sale.grossValue || 0;
                    const fee = c ? (gross * ((c.commission || 0) / 100)) + (c.fixedFee || 0) : 0;
                    const shipping = sale.shipping || 0;
                    const net = gross - fee - shipping;
                    return acc + net;
                }, 0);

                const mpTransfersOut = transactions.filter(t => t.accountId === 'mercado-pago' && t.type === 'OUT').reduce((sum, t) => sum + t.amount, 0);
                const mpTransfersIn = transactions.filter(t => t.accountId === 'mercado-pago' && t.type === 'IN').reduce((sum, t) => sum + t.amount, 0);
                const mpBalance = mlSalesTotal + mpTransfersIn - mpTransfersOut;

                const bankTransfersIn = transactions.filter(t => t.accountId === 'caixa-principal' && t.type === 'IN').reduce((sum, t) => sum + t.amount, 0);
                const bankTransfersOut = transactions.filter(t => t.accountId === 'caixa-principal' && t.type === 'OUT').reduce((sum, t) => sum + t.amount, 0);
                const bankBalance = bankTransfersIn - bankTransfersOut;

                const totalBalance = mpBalance + bankBalance;

                const handleTransfer = async () => {
                    if (!transferData.amount || isNaN(transferData.amount) || transferData.amount <= 0) return alert('Valor inválido');
                    
                    try {
                        const res = await fetch('/api/transactions/transfer', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                date: transferData.date,
                                amount: parseFloat(transferData.amount),
                                fromAccount: transferData.from,
                                toAccount: transferData.to
                            })
                        });
                        if (res.ok) {
                            const refreshRes = await fetch('/api/data');
                            if (refreshRes.ok) {
                                const db = await refreshRes.json();
                                if (db.transactions) setTransactions(db.transactions);
                            }
                            setIsTransferring(false);
                            setTransferData({ ...transferData, amount: '' });
                        }
                    } catch (e) {
                        console.error(e);
                        alert('Erro ao transferir');
                    }
                };

                const handleTransaction = async () => {
                    if (!transactionData.amount || isNaN(transactionData.amount) || transactionData.amount <= 0 || !transactionData.description) return alert('Preencha os campos obrigatórios');
                    
                    try {
                        const res = await fetch('/api/transactions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                ...transactionData,
                                amount: parseFloat(transactionData.amount)
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setTransactions([data.transaction, ...transactions]);
                            setIsAddingTransaction(false);
                            setTransactionData({ ...transactionData, amount: '', description: '' });
                        }
                    } catch (e) {
                        console.error(e);
                        alert('Erro ao registrar transação');
                    }
                };

                return (
                    <div className="space-y-6 animate-fade-in pb-12">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">Caixa e Bancos</h2>
                                <p className="text-gray-400 mt-1">Gerencie o fluxo de dinheiro da empresa</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setIsTransferring(true)} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2">
                                    <i data-lucide="arrow-right-left" className="w-4 h-4"></i> Transferir Saldos
                                </button>
                                <button onClick={() => setIsAddingTransaction(true)} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-2">
                                    <i data-lucide="plus" className="w-4 h-4"></i> Nova Movimentação
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                    <i data-lucide="wallet" className="w-24 h-24"></i>
                                </div>
                                <h3 className="text-sm font-bold text-gray-400 mb-2 uppercase tracking-wider">Saldo Total</h3>
                                <div className="text-4xl font-black text-white">{new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(totalBalance)}</div>
                            </div>
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                    <i data-lucide="shopping-bag" className="w-24 h-24"></i>
                                </div>
                                <h3 className="text-sm font-bold text-blue-400 mb-2 uppercase tracking-wider">Mercado Pago</h3>
                                <div className="text-3xl font-black text-white">{new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(mpBalance)}</div>
                                <div className="text-xs text-gray-500 mt-2">Acumulado líquido de vendas</div>
                            </div>
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                    <i data-lucide="building" className="w-24 h-24"></i>
                                </div>
                                <h3 className="text-sm font-bold text-emerald-400 mb-2 uppercase tracking-wider">Conta Bancária Principal</h3>
                                <div className="text-3xl font-black text-white">{new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(bankBalance)}</div>
                                <div className="text-xs text-gray-500 mt-2">Saldo em banco</div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl border border-white/5">
                            <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="list" className="w-5 h-5 text-brand-orange"></i> Extrato de Transações</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-white/5 text-gray-400 text-sm">
                                            <th className="pb-3 font-semibold w-24">Data</th>
                                            <th className="pb-3 font-semibold">Descrição</th>

                                    <tbody className="text-sm">

                                                            </td>
                                                            <td className="py-2 px-2">
                                                                <select value={editTxData.accountId} onChange={e => setEditTxData({...editTxData, accountId: e.target.value})} className="w-full bg-[#16161A] border border-brand-orange/40 text-gray-400 rounded p-1 text-xs">
                                                                    {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                                </select>
                                                            </td>
                                                            <td className="py-2 px-2 text-right flex gap-1 items-center justify-end">
                                                                <select value={editTxData.type} onChange={e => setEditTxData({...editTxData, type: e.target.value})} className="bg-[#16161A] border border-brand-orange/40 text-white rounded p-1 text-xs"><option value="IN">+</option><option value="OUT">-</option></select>
                                                                <input type="number" step="0.01" value={editTxData.amount} onChange={e => setEditTxData({...editTxData, amount: e.target.value})} className="w-20 bg-[#16161A] border border-brand-orange/40 text-white rounded p-1 text-xs text-right" />
                                                            </td>
                                                            <td className="py-2 px-2 text-right space-x-1 whitespace-nowrap">
                                                                <button onClick={handleSaveEdit} className="p-1 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/40 rounded transition-all"><i data-lucide="check" className="w-4 h-4"></i></button>
                                                                <button onClick={handleCancelEdit} className="p-1 bg-gray-500/20 text-gray-400 hover:bg-gray-500/40 rounded transition-all"><i data-lucide="x" className="w-4 h-4"></i></button>
                                                            </td>
                                                        </tr>
                                                    );
                                                }
                                                return (
                                                    <tr key={t.id || idx} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                                                        <td className="py-3 text-gray-300">{new Date(t.date).toLocaleDateString('pt-BR', {timeZone: 'UTC'})}</td>
                                                        <td className="py-3 text-white font-medium">{t.description} <span className="text-[10px] ml-2 bg-white/10 px-2 py-0.5 rounded text-gray-400">{t.category}</span></td>
                                                        <td className="py-3 text-gray-400">{account.name}</td>
                                                        <td className={`py-3 text-right font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                            {isPos ? '+' : '-'} {new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(t.amount)}
                                                        </td>
                                                        <td className="py-3 text-right space-x-2 whitespace-nowrap">
                                                                                                    {sale.channelId.startsWith('ml') && (
                                        <button
                                            id={`btn-nfe-${sale.id}`}
                                            onClick={() => handleEmitirNfeTiny(sale)}
                                            className="p-1.5 hover:bg-blue-500/20 rounded-lg text-gray-400 hover:text-blue-400 mr-1"
                                            title="Emitir NF-e via Tiny ERP"
                                        >
                                            🖨️
                                        </button>
                                        )}
<button onClick={() => handleEditClick(t)} className="p-1.5 hover:bg-brand-orange/20 text-gray-500 hover:text-brand-orange rounded-lg transition-all" title="Editar"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                            <button onClick={() => handleDeleteTx(t.id)} className="p-1.5 hover:bg-rose-500/20 text-gray-500 hover:text-rose-400 rounded-lg transition-all" title="Excluir"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Modal Transferência */}
                        {isTransferring && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-brand-darkBg border border-white/10 p-6 rounded-3xl w-full max-w-md shadow-2xl relative">
                                    <button onClick={() => setIsTransferring(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white rounded-full bg-white/5"><i data-lucide="x" className="w-5 h-5"></i></button>
                                    <h3 className="text-xl font-bold text-white mb-6">Transferir Saldos</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1">Origem</label>
                                            <select value={transferData.from} onChange={e => setTransferData({...transferData, from: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                                                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex justify-center text-brand-orange"><i data-lucide="arrow-down" className="w-5 h-5"></i></div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1">Destino</label>
                                            <select value={transferData.to} onChange={e => setTransferData({...transferData, to: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                                                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-400 mb-1">Valor (R$)</label>
                                                <input type="number" step="0.01" value={transferData.amount} onChange={e => setTransferData({...transferData, amount: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" placeholder="0.00" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-400 mb-1">Data</label>
                                                <input type="date" value={transferData.date} onChange={e => setTransferData({...transferData, date: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" />
                                            </div>
                                        </div>
                                        <button onClick={handleTransfer} className="w-full mt-4 bg-brand-orange hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition-all">Confirmar Transferência</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Nova Transação */}
                        {isAddingTransaction && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-brand-darkBg border border-white/10 p-6 rounded-3xl w-full max-w-md shadow-2xl relative">
                                    <button onClick={() => setIsAddingTransaction(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white rounded-full bg-white/5"><i data-lucide="x" className="w-5 h-5"></i></button>
                                    <h3 className="text-xl font-bold text-white mb-6">Nova Movimentação</h3>
                                    <div className="space-y-4">
                                        <div className="flex gap-4 mb-2">
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="radio" name="txType" checked={transactionData.type === 'IN'} onChange={() => setTransactionData({...transactionData, type: 'IN'})} className="accent-emerald-500 w-4 h-4" />
                                                <span className="text-emerald-400 font-bold">Entrada</span>
                                            </label>
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="radio" name="txType" checked={transactionData.type === 'OUT'} onChange={() => setTransactionData({...transactionData, type: 'OUT'})} className="accent-rose-500 w-4 h-4" />
                                                <span className="text-rose-400 font-bold">Saída</span>
                                            </label>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1">Descrição</label>
                                            <input type="text" value={transactionData.description} onChange={e => setTransactionData({...transactionData, description: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" placeholder="Ex: Aporte de Sócio" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 mb-1">Conta</label>
                                            <select value={transactionData.accountId} onChange={e => setTransactionData({...transactionData, accountId: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                                                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-400 mb-1">Valor (R$)</label>
                                                <input type="number" step="0.01" value={transactionData.amount} onChange={e => setTransactionData({...transactionData, amount: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" placeholder="0.00" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-400 mb-1">Data</label>
                                                <input type="date" value={transactionData.date} onChange={e => setTransactionData({...transactionData, date: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none" />
                                            </div>
                                        </div>
                                        <button onClick={handleTransaction} className="w-full mt-4 bg-brand-orange hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition-all">Salvar Movimentação</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // --- ABA 8: DESPESAS ADMINISTRATIVAS ---
            function ExpensesView({ expenses, setExpenses, selectedMonth, monthlyClosings = [], accounts = [], transactions = [], setTransactions }) {
                const [isAdding, setIsAdding] = useState(false);
                const [newExpense, setNewExpense] = useState({
                    name: '',
                    category: 'Agua', // Agua, Luz, Telefone, Contador, Outros
                    value: '',
                    dueDate: '',
                    status: 'Pendente',
                    competency: selectedMonth // Prefills with active dashboard filter month
                });

                const isClosed = (comp) => {
                    return monthlyClosings.some(c => c.month === comp);
                };

                // Whenever selectedMonth changes, update the form's default competency
                useEffect(() => {
                    setNewExpense(prev => ({ ...prev, competency: selectedMonth }));
                }, [selectedMonth]);

                const handleSaveExpense = (e) => {
                    e.preventDefault();
                    if (isClosed(newExpense.competency)) {
                        alert(`Atenção: O mês de competência ${newExpense.competency} já está fechado e não pode receber novos lançamentos.`);
                        return;
                    }
                    const exp = {
                        id: 'exp' + (expenses.length + 1) + Date.now().toString().slice(-2),
                        name: newExpense.name,
                        category: newExpense.category,
                        value: parseFloat(newExpense.value),
                        dueDate: newExpense.dueDate,
                        status: newExpense.status,
                        competency: newExpense.competency,
                        accountId: newExpense.accountId
                    };
                    mutateServer('expenses', 'add', exp);
                    setExpenses([...expenses, exp]);
                    
                    const tx = {
                        id: 'tx' + Date.now(),
                        date: newExpense.dueDate,
                        description: `Despesa: ${newExpense.name}`,
                        type: 'OUT',
                        amount: parseFloat(newExpense.value),
                        accountId: newExpense.accountId || 'caixa-principal',
                        category: 'Despesa Administrativa'
                    };
                    if (setTransactions) setTransactions(prev => [tx, ...prev]);

                    setIsAdding(false);
                    setNewExpense({ name: '', category: 'Agua', value: '', dueDate: '', status: 'Pendente', competency: selectedMonth, accountId: 'caixa-principal' });
                };

                const handleDelete = (id) => {
                    const exp = expenses.find(e => e.id === id);
                    if (exp && isClosed(exp.competency)) {
                        alert("Atenção: Esta despesa pertence a um mês fechado e não pode ser excluída.");
                        return;
                    }
                    if (confirm("Deseja realmente remover esta despesa?")) {
                        mutateServer('expenses', 'delete', null, id);
                        setExpenses(expenses.filter(e => e.id !== id));
                    }
                };

                const toggleStatus = (id) => {
                    const exp = expenses.find(e => e.id === id);
                    if (exp && isClosed(exp.competency)) {
                        alert("Atenção: Esta despesa pertence a um mês fechado e não pode ser alterada.");
                        return;
                    }
                    mutateServer('expenses', 'toggleStatus', null, id);
                    setExpenses(expenses.map(e => e.id === id ? { ...e, status: e.status === 'Pago' ? 'Pendente' : 'Pago' } : e));
                };

                // Filtro por Competência
                const filteredExpenses = expenses.filter(e => e.competency === selectedMonth && e.category !== 'Matéria-Prima');

                // Cálculos das Despesas do Mês Filtrado
                const totalExpensesValue = filteredExpenses.reduce((acc, curr) => acc + curr.value, 0);
                const paidExpensesValue = filteredExpenses.filter(e => e.status === 'Pago').reduce((acc, curr) => acc + curr.value, 0);
                const pendingExpensesValue = filteredExpenses.filter(e => e.status === 'Pendente').reduce((acc, curr) => acc + curr.value, 0);

                const getCategoryEmoji = (category) => {
                    switch(category) {
                        case 'Agua': return '💧';
                        case 'Luz': return '⚡';
                        case 'Telefone': return '🌐';
                        case 'Contador': return '💼';
                        default: return '💸';
                    }
                };

                return (
                    <div className="space-y-8 animate-fade-in">
                        <div className="flex justify-between items-center border-b border-brand-borderBg pb-4">
                            <div>
                                <span className="text-xs font-bold tracking-widest text-brand-orange uppercase">Gestão Financeira</span>
                                <h3 className="font-black text-2xl text-gradient">Despesas Administrativas</h3>
                            </div>
                            <button 
                                onClick={() => setIsAdding(!isAdding)}
                                className="bg-brand-orange/10 border border-brand-orange/40 hover:bg-brand-orange/20 text-brand-orange px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all"
                            >
                                <i data-lucide={isAdding ? "minus" : "plus"} className="w-4 h-4"></i>
                                {isAdding ? "Fechar Painel" : "Lançar Nova Despesa"}
                            </button>
                        </div>

                        {/* Indicadores de Despesas */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 flex flex-col justify-between">
                                <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-widest">Total no Mês</span>
                                <span className="text-2xl font-black text-white mt-2">R$ {totalExpensesValue.toFixed(2)}</span>
                            </div>
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 flex flex-col justify-between">
                                <span className="text-[10px] text-emerald-500 font-extrabold uppercase tracking-widest">Pago</span>
                                <span className="text-2xl font-black text-emerald-400 mt-2">R$ {paidExpensesValue.toFixed(2)}</span>
                            </div>
                            <div className="glass-panel p-6 rounded-2xl border border-white/5 flex flex-col justify-between">
                                <span className="text-[10px] text-rose-500 font-extrabold uppercase tracking-widest">Pendente</span>
                                <span className="text-2xl font-black text-rose-400 mt-2">R$ {pendingExpensesValue.toFixed(2)}</span>
                            </div>
                        </div>

                        {isAdding && (
                            <form onSubmit={handleSaveExpense} className="glass-panel border border-white/15 rounded-2xl p-6 grid grid-cols-1 md:grid-cols-4 gap-4 animate-fade-in shadow-2xl">
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Descrição da Despesa</label>
                                    <input 
                                        type="text" required placeholder="Ex: Conta de Luz Oficina"
                                        value={newExpense.name} onChange={e => setNewExpense({...newExpense, name: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Categoria</label>
                                    <select 
                                        value={newExpense.category} onChange={e => setNewExpense({...newExpense, category: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                    >
                                        <option value="Agua">💧 Água</option>
                                        <option value="Luz">⚡ Luz</option>
                                        <option value="Telefone">🌐 Telefone & Internet</option>
                                        <option value="Contador">💼 Contador</option>
                                        <option value="Outros">💸 Outros</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Valor da Despesa (R$)</label>
                                    <input 
                                        type="number" step="0.01" required placeholder="0.00"
                                        value={newExpense.value} onChange={e => setNewExpense({...newExpense, value: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Data de Vencimento</label>
                                    <input 
                                        type="date" required
                                        value={newExpense.dueDate} onChange={e => setNewExpense({...newExpense, dueDate: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-gray-400"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Mês de Competência</label>
                                    <input 
                                        type="month" required
                                        value={newExpense.competency} onChange={e => setNewExpense({...newExpense, competency: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange text-gray-400"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Status Inicial</label>
                                    <select 
                                        value={newExpense.status} onChange={e => setNewExpense({...newExpense, status: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                    >
                                        <option value="Pendente">Pendente</option>
                                        <option value="Pago">Pago</option>
                                    </select>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Conta de Saída (Caixa)</label>
                                    <select 
                                        value={newExpense.accountId} onChange={e => setNewExpense({...newExpense, accountId: e.target.value})}
                                        className="w-full bg-[#16161A] border border-brand-borderBg text-white rounded-xl p-3 focus:outline-none focus:border-brand-orange"
                                    >
                                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                    </select>
                                </div>
                                <button type="submit" className="md:col-span-4 btn-gradient py-3.5 rounded-xl text-black font-bold uppercase tracking-wider text-xs md:text-sm mt-4">
                                    Cadastrar Despesa
                                </button>
                            </form>
                        )}

                        {/* Listagem de Despesas */}
                        <div className="glass-panel border border-white/5 rounded-2xl overflow-hidden shadow-lg">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-gray-300">
                                    <thead className="bg-white/5 border-b border-brand-borderBg text-[10px] font-extrabold uppercase tracking-widest text-gray-400">
                                        <tr>
                                            <th className="py-4 px-6">Categoria</th>
                                            <th className="py-4 px-6">Despesa</th>
                                            <th className="py-4 px-6">Vencimento</th>
                                            <th className="py-4 px-6 text-right">Valor</th>
                                            <th className="py-4 px-6 text-center">Status</th>
                                            <th className="py-4 px-6 text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {filteredExpenses.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="py-8 text-center text-gray-500 font-medium">Nenhuma despesa para o mês selecionado.</td>
                                            </tr>
                                        ) : (
                                            filteredExpenses.map(exp => (
                                                <tr key={exp.id} className="hover:bg-white/5 transition-all">
                                                    <td className="py-4 px-6 font-bold text-white text-base">
                                                        {getCategoryEmoji(exp.category)} {exp.category}
                                                    </td>
                                                    <td className="py-4 px-6 font-semibold text-white">{exp.name}</td>
                                                    <td className="py-4 px-6 font-medium text-gray-400">{exp.dueDate}</td>
                                                    <td className="py-4 px-6 text-right font-bold text-white">R$ {exp.value.toFixed(2)}</td>
                                                    <td className="py-4 px-6 text-center">
                                                        <button 
                                                            onClick={() => toggleStatus(exp.id)}
                                                            disabled={isClosed(exp.competency)}
                                                            className={`text-[9px] px-3 py-1.5 rounded-full font-black uppercase tracking-wider transition-all border ${
                                                                exp.status === 'Pago' 
                                                                    ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                                                                    : 'bg-rose-500/10 text-rose-400 border-rose-500/20 hover:bg-rose-500/20'
                                                            } ${isClosed(exp.competency) ? 'opacity-70 cursor-not-allowed' : ''}`}
                                                        >
                                                            {exp.status}
                                                        </button>
                                                    </td>
                                                    <td className="py-4 px-6 text-right space-x-2">
                                                        {isClosed(exp.competency) ? (
                                                            <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider flex items-center justify-end gap-1" title="Mês fechado - alterações bloqueadas">
                                                                🔒 Fechado
                                                            </span>
                                                        ) : (
                                                            <button 
                                                                onClick={() => handleDelete(exp.id)}
                                                                className="p-1.5 hover:bg-rose-500/20 text-gray-500 hover:text-rose-400 rounded-lg transition-all"
                                                            >
                                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }
        
        
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
